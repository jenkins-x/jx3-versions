name: Update charts in the version stream
on:
  schedule:
    # run at midnight
    - cron: '0 0 * * *'

  # allow manual triggering
  workflow_dispatch: {}
jobs:
  issue:
    if: github.repository_owner == 'jenkins-x'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GIT_TOKEN: ${{ secrets.GIT_BOT_TOKEN }}
        name: updatebot
        uses: docker://ghcr.io/jenkins-x/jx-updatebot:0.8.41
        with:
          entrypoint: .github/workflows/update-charts/updatebot.sh
